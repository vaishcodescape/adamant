# Local backend. `docker compose up -d postgres` is enough for migrations;
# `docker compose up` also starts the API and worker.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: adamant
      POSTGRES_PASSWORD: adamant
      POSTGRES_DB: adamant
    ports:
      - '5432:5432'
    volumes:
      - adamant-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adamant -d adamant']
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8787:8787'
    environment:
      PORT: '8787'
      DATABASE_URL: postgres://adamant:adamant@postgres:5432/adamant
      # The API verifies the HMAC and enqueues. It gets no GitHub App key.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # Both halves of the seeded session. Without the user id every
      # authenticated route answers 500.
      ADAMANT_SESSION_SECRET: ${ADAMANT_SESSION_SECRET:-}
      ADAMANT_SEED_USER_ID: ${ADAMANT_SEED_USER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    init: true

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://adamant:adamant@postgres:5432/adamant
      # Model calls run in this process only. The API service does not receive the key.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6}
      # The agent mints an installation token per call from these.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      ADAMANT_SANDBOX_IMAGE: ${ADAMANT_SANDBOX_IMAGE:-node:22-bookworm-slim}
      ADAMANT_SANDBOX_INSTALL: ${ADAMANT_SANDBOX_INSTALL:-npm ci --no-audit --no-fund}
      ADAMANT_SANDBOX_TEST: ${ADAMANT_SANDBOX_TEST:-npm test}
      ADAMANT_WORKER_CONCURRENCY: ${ADAMANT_WORKER_CONCURRENCY:-2}
      ADAMANT_WORKSPACE_ROOT: ${ADAMANT_WORKSPACE_ROOT:-/tmp/adamant-workspaces}
    # The sandbox starts one container per candidate, so the worker needs a
    # Docker socket. Nothing is mounted into the sandbox container itself.
    #
    # That container is started by the host's daemon, which resolves the
    # worktree bind mount on the host, so the workspace root is mounted at the
    # same path on both sides. Create it first and let uid 1000 write to it:
    #   mkdir -p /tmp/adamant-workspaces && chown 1000 /tmp/adamant-workspaces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ADAMANT_WORKSPACE_ROOT:-/tmp/adamant-workspaces}:${ADAMANT_WORKSPACE_ROOT:-/tmp/adamant-workspaces}
    # The worker runs as `node`; the socket belongs to the host's docker group.
    # On Linux: DOCKER_GID=$(stat -c %g /var/run/docker.sock).
    group_add:
      - ${DOCKER_GID:-0}
    depends_on:
      postgres:
        condition: service_healthy
    init: true

volumes:
  adamant-pg:
