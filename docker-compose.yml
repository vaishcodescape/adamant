# Local backend. `docker compose up -d postgres` is enough for migrations;
# `docker compose up` also starts the API and worker.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: adamant
      POSTGRES_PASSWORD: adamant
      POSTGRES_DB: adamant
    ports:
      - '5432:5432'
    volumes:
      - adamant-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adamant -d adamant']
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8787:8787'
    environment:
      PORT: '8787'
      DATABASE_URL: postgres://adamant:adamant@postgres:5432/adamant
    depends_on:
      postgres:
        condition: service_healthy
    init: true

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://adamant:adamant@postgres:5432/adamant
    depends_on:
      postgres:
        condition: service_healthy
    init: true

volumes:
  adamant-pg:
